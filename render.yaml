services:
  - type: web
    name: interactive-portfolio-backend
    rootDir: backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GOOGLE_API_KEY
        sync: false       
      - key: RESUME_URL
        sync: false        
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma  
